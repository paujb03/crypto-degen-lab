max_positions = 6
max_position_pct = 0.15
min_cash_pct = 0.15
max_pool_share = 0.01
stop_loss = -0.25
trailing_stop = -0.22
take_profit = 0.60
take_profit_fraction = 0.5
max_hold_hours = 240
